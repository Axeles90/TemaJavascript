<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto </title>
    <link rel="stylesheet" href="estilos.css">
    <script>
        function validarnombre(elemento){
            if((elemento.value.length < 6) || (elemento.value.length > 15)){
                alert("El usuario debe tener entre 6 y 15 caracteres");
                return false;
            }
            else return true;
        }

        function validaremail(elemento){
            if(
                (elemento.value.indexOf(" ")==-1) &&
                (elemento.value.indexOf("@")!=-1) &&
                (elemento.value.indexOf(".")!=-1)
            ){
                return true;
            }
            else{
                alert("Email no valido");
                return false;
            }
        }

        function validarformulario(elemento1,elemento2){
            var nom;
            var correoelectronico;
            nom = validarnombre(elemento1);
            correoelectronico = validaremail(elemento2);
            if((nom == true) && (correoelectronico == true)){
                alert("Bienvenido");
                return true;
            }
            else return false;
        }

        function cargarpagina(){
            if(navigator.appCodeName.indexOf("Mozilla") != -1){
                alert("Esta en mozilla");
            }
            else if (naigator.appCodeName.indexOf ("Chrome") != -1){
                alert("Esta en chrome");
            }
            else{
                alert("Esta en otro navegador");
            }
        }

        function escalar(h){
            if( h == 480) return 0.75
            else if (h ==600) return 1
            else if (h == 768) return 1.25
        }
        
    </script>
</head>
<body onload="cargarpagina();">
    <div id="formulario" >
        <form action="/send/" method="post" name="contacto" id="contacto" onsubmit="return validarformulario(document.contacto.nombre , document.contacto.email)">
            <fieldset>
                <legend>Datos de contacto</legend>
                <label for="" name="nombre" id="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" required tabindex="1" placeholder="Nombre...." onchange="return validarnombre(this);"><br><br>
                <label for="" name="apellidos" id="apellidos">Apellidos</label>
                <input type="text" name="apellidos" id="apellidos" required placeholder="Apellidos..."><br><br>
                <label for="" name="email" id="email">E-mail</label>
                <input type="email" name="email" id="email" required placeholder="Correo electronico..." onchange="return validaremail(this);"> <br><br>
            </fieldset>
            <fieldset>
                <legend>Informacion adicional</legend>
                <label for="">Seleccione la incidencia</label>
                <select name="incidencia" id="incidencia" >
                    <option class="default" value="default" selected>--Eliga su incidencia--</option>
                    <option value="conexion">Problema de conexion</option>
                    <option value="encendido">Problema con el encendido</option>
                    <option value="internet">Problema con conexion a internet </option>
                </select><br><br>
                
            </fieldset>
            <input type="submit" name="enviar" id="enviar" class="boton">
            <input type="reset" name="reset" id="reset" value="Cancelar" class="boton"><br><br>
            
                <input type="text" name="nombre" id="nombre" class="prueba" placeholder="Ingrese su nombre..."><br><br>

            
        </form><br>
        <div class="picachu">
            <script>
                var alto = screen.height;
                var escala = escalar(alto);
                var anchoimg = escala * 601;
                var altoimg = escala * 397;
                document.write('<CENTER><img border="0" heigth="');
                document.write(altoimg + '"alt="pikachu.png (46285 bytes)" src="pikachu.png" width="');
                document.write(anchoimg + '">');
            </script>
        </div>
    </div>
</body>
</html>
